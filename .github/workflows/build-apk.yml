name: Build POS System APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          openjdk-17-jdk \
          zip \
          unzip \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libtinfo5 \
          libgmp-dev \
          liblzma-dev
        
    - name: Install Python build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Cython==0.29.33
        pip install buildozer
        
    - name: Create buildozer.spec using echo commands
      run: |
        # Create buildozer.spec line by line to avoid YAML parsing issues
        echo '[app]' > buildozer.spec
        echo 'title = POS System' >> buildozer.spec
        echo 'package.name = possystem' >> buildozer.spec
        echo 'package.domain = org.kivy' >> buildozer.spec
        echo '' >> buildozer.spec
        echo 'source.dir = .' >> buildozer.spec
        echo 'source.include_exts = py,png,jpg,kv,atlas,json,txt,ttf' >> buildozer.spec
        echo '' >> buildozer.spec
        echo 'version = 1.0.0' >> buildozer.spec
        echo 'requirements = python3,kivy' >> buildozer.spec
        echo '' >> buildozer.spec
        echo 'android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE' >> buildozer.spec
        echo '' >> buildozer.spec
        echo 'android.api = 33' >> buildozer.spec
        echo 'android.minapi = 21' >> buildozer.spec
        echo 'android.ndk = 25b' >> buildozer.spec
        echo '' >> buildozer.spec
        echo 'orientation = portrait' >> buildozer.spec
        echo 'fullscreen = 0' >> buildozer.spec
        echo '' >> buildozer.spec
        echo '[buildozer]' >> buildozer.spec
        echo 'log_level = 2' >> buildozer.spec
        echo 'warn_on_root = 1' >> buildozer.spec
        
    - name: Rename main file for Buildozer
      run: |
        if [ -f "pos2.py" ] && [ ! -f "main.py" ]; then
          cp pos2.py main.py
          echo "Copied pos2.py to main.py"
        fi
        
    - name: Build APK with Buildozer
      run: |
        buildozer -v android clean
        buildozer -v android debug
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pos-system-apk
        path: bin/*.apk
        retention-days: 30
